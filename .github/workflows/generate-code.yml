name: Generate Code from Blueprints

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate code from blueprints
        uses: vtemian/blueprints-action@v1
        with:
           api-key: ${{ secrets.ANTHROPIC_API_KEY }}
           src: src/
           output-dir: './generated/task-api'
           language: python
           auto-commit: true
           commit-branch: code
           base-branch: 'main'
           commit-message: "feat: generate Task API #{github.sha} from blueprints"

      - name: Output branch info
        run: |
            echo "Generated code has been committed to branch: code"
            echo "View the generated code at:"
            echo "https://github.com/${{ github.repository }}/tree/code"